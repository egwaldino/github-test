<!doctype html>
<html lang="pt-Pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/form.css" />
    <title>Formulário</title>
  </head>
  <body>
    <form action="formulario.html" method="post">
      <div id="form-header">
        <img
          src="/assets/egwaldino.jpg"
          alt="Egwaldino Cassuente"
          width="100"
          height="100" />
        <div class="form-header-text">
          <h1>Formulário de Contato</h1>
          <h4>Fale diretamente comigo por este formulário</h4>
        </div>
      </div>
      <label for="nome">Nome:</label><br />
      <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Exemplo: Egwaldino Cassuente"
        required /><br /><br />

      <label for="email">Email:</label><br />
      <input
        type="email"
        id="email"
        name="email"
        placeholder="exemplodoseuemail@email.com"
        required /><br /><br />

      <label for="mensagem">Mensagem:</label><br />
      <textarea
        id="mensagem"
        name="mensagem"
        rows="4"
        cols="50"
        placeholder="Digite sua mensagem aqui"
        required></textarea
      ><br /><br />

      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
