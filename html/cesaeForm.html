<!doctype html>
<html lang="pt-Pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cesae - Formulário de Contato</title>
  </head>
  <body>
    <header>
      <h1>Formulário de Contato</h1>
    </header>

    <main>
      <form action="/html/cesaeForm.html" method="post">
        <fieldset>
          <legend>Formulário de Contato do CEASE</legend>
          <div class="form-group-text">
            <label for="nome">Nome:</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Digite seu nome"
              required />

            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Digite seu email"
              required />
          </div>

          <div class="form-group-checkbox">
            <label for="genero">Género:</label>
            <input
              type="checkbox"
              id="masculino"
              name="genero"
              value="masculino" />
            <label for="masculino">Masculino</label>

            <input
              type="checkbox"
              id="feminino"
              name="genero"
              value="feminino" />
            <label for="feminino">Feminino</label>

            <input type="checkbox" id="outro" name="genero" value="outro" />
            <label for="outro">Outro</label>
          </div>

          <div class="form-group-date-turma-mensagem">
            <label for="date">Data atual:</label>
            <input type="date" id="date" name="date" />

            <label for="select">Turma:</label>
            <select id="select" name="select">
              <option value="turma1">Web Developer & Mobile</option>
              <option value="turma2">Digital Marketing</option>
              <option value="turma3">Data Science</option>
              <option value="turma4">Cybersecurity</option>
              <option value="turma5">UI/UX Design</option>
            </select>

            <label for="mensagem">Mensagem:</label>
            <textarea
              id="mensagem"
              name="mensagem"
              placeholder="Digite sua mensagem"
              rows="4"
              cols="20"></textarea>
          </div>

          <div class="form-group-buttons">
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
          </div>
        </fieldset>
      </form>
    </main>
  </body>
</html>
